<style>
  :root{--paper:#FBF7F0;--card:#FFF;--sink:#F2EDE3;--ink:#23261F;--ink-soft:#5C6156;--muted:#8E9284;
    --green:#2F5D50;--terra:#C4703F;--rule:rgba(35,38,31,.12);--rule-soft:rgba(35,38,31,.07);
    --due:#B3541E;--red:#A63D2F;--ok:#2F5D50;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.5;
    padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 60px);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:640px;margin:0 auto;padding:0 18px;}
  .head{padding:26px 0 6px;}
  .brand{font-family:'Fraunces',serif;font-weight:600;letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:var(--terra);}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(28px,7vw,38px);line-height:1.05;margin:5px 0 2px;}
  .sub{color:var(--ink-soft);font-size:14px;}
  .tabs{display:flex;gap:6px;margin:18px 0 4px;background:var(--sink);padding:5px;border-radius:12px;}
  .tab{flex:1;border:none;background:transparent;cursor:pointer;padding:10px 6px;border-radius:8px;font-weight:600;font-size:14px;color:var(--ink-soft);font-family:'Inter',sans-serif;}
  .tab.on{background:var(--card);color:var(--green);box-shadow:0 1px 3px rgba(0,0,0,.07);}
  .tab:focus-visible{outline:3px solid var(--terra);outline-offset:2px;}
  .card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:20px;margin-top:16px;}
  .label{font-family:'Fraunces',serif;font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:11px;color:var(--terra);margin-bottom:6px;}
  .meal{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(26px,7vw,36px);line-height:1.1;margin:2px 0 8px;}
  .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .chip{font-size:13px;background:var(--sink);border-radius:999px;padding:6px 12px;color:var(--ink-soft);}
  .chip b{color:var(--ink);font-weight:600;}
  .chip.time{background:rgba(47,93,80,.1);color:var(--green);}
  .chip.time b{color:var(--green);}
  .noteline{margin-top:14px;padding:12px 14px;background:var(--sink);border-radius:10px;font-size:14px;color:var(--ink-soft);}
  .noteline b{color:var(--ink);font-weight:600;display:block;margin-bottom:2px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-family:'Fraunces',serif;}
  .noteline.warn{background:rgba(196,112,63,.1);}
  .noteline.warn b{color:var(--terra);}
  .ing{margin-top:16px;}
  .ing-h{font-family:'Fraunces',serif;font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  .ing-list span{display:inline-block;background:var(--sink);border-radius:6px;padding:5px 10px;margin:0 6px 6px 0;font-size:14px;}
  .ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:4px;}
  .field{flex:1;min-width:130px;}
  .field label{display:block;font-size:12px;font-family:'Fraunces',serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;font-weight:600;}
  .field input,.field select{width:100%;padding:11px 12px;border:1px solid var(--rule);border-radius:10px;font-family:'Inter',sans-serif;font-size:15px;background:var(--card);color:var(--ink);}
  .btn{border:none;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;font-size:15px;padding:13px 20px;border-radius:10px;background:var(--green);color:#fff;}
  .btn:active{background:#254a40;}
  .btn:focus-visible{outline:3px solid var(--terra);outline-offset:2px;}
  .btn.wide{width:100%;margin-top:16px;}
  .covering{margin-top:14px;font-size:14px;color:var(--ink-soft);}
  .covering b{color:var(--ink);}
  .mealpills{margin-top:10px;}
  .mealpills span{display:inline-block;font-size:13px;background:var(--sink);border-radius:999px;padding:5px 11px;margin:0 5px 5px 0;color:var(--ink-soft);}
  /* budget */
  .budget{margin-top:16px;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:18px 20px;}
  .b-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .b-total{font-family:'Fraunces',serif;font-weight:700;font-size:32px;line-height:1;}
  .b-total.over{color:var(--red);}
  .b-total.warn{color:#B3541E;}
  .b-total.ok{color:var(--ok);}
  .b-target{font-size:13px;color:var(--muted);text-align:right;}
  .b-bar{margin-top:12px;height:8px;border-radius:8px;background:var(--sink);overflow:hidden;position:relative;}
  .b-bar>i{display:block;height:100%;background:var(--ok);transition:width .3s ease;}
  .b-bar>i.over{background:var(--red);}
  .b-bar>i.warn{background:#D98A3D;}
  @media(prefers-reduced-motion:reduce){.b-bar>i{transition:none;}}
  .b-msg{margin-top:10px;font-size:13.5px;color:var(--ink-soft);}
  .b-msg.over{color:var(--red);font-weight:500;}
  .b-msg.warn{color:#B3541E;font-weight:500;}
  .trim{margin-top:14px;padding:14px;background:rgba(166,61,47,.07);border-radius:10px;}
  .trim-h{font-family:'Fraunces',serif;font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin-bottom:8px;}
  .trim-row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px;border-bottom:1px solid rgba(166,61,47,.12);}
  .trim-row:last-child{border-bottom:none;}
  .trim-row .tn{flex:1;}
  .trim-row .tp{color:var(--ink-soft);font-size:13px;}
  .tbtn{border:1px solid rgba(166,61,47,.35);background:transparent;color:var(--red);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
  .tbtn.on{background:var(--red);color:#fff;}
  .sec{margin-top:22px;}
  .sec-h{display:flex;align-items:baseline;justify-content:space-between;font-family:'Fraunces',serif;font-weight:600;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);padding-bottom:7px;border-bottom:2px solid rgba(47,93,80,.18);margin-bottom:4px;}
  .sec-h .cnt{font-family:'Inter',sans-serif;font-size:12px;letter-spacing:0;text-transform:none;color:var(--muted);font-weight:500;}
  .item{display:flex;align-items:flex-start;gap:12px;padding:11px 2px;border-bottom:1px solid var(--rule-soft);}
  .item.off{opacity:.45;}
  .tag{display:inline-block;margin-left:7px;font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 6px;border-radius:5px;vertical-align:1px;}
  .tag-r{background:rgba(47,93,80,.13);color:var(--green);}
  .tag-s{background:rgba(0,0,0,.06);color:var(--muted);}
  .item.deferred{opacity:.4;}
  .box{flex:0 0 22px;width:22px;height:22px;margin-top:1px;border-radius:6px;border:2px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;}
  .item.done .box{background:var(--green);border-color:var(--green);}
  .box svg{width:13px;height:13px;opacity:0;}
  .item.done .box svg{opacity:1;}
  .box:focus-visible{outline:3px solid var(--terra);outline-offset:2px;}
  .i-body{flex:1;min-width:0;}
  .i-name{font-size:15px;font-weight:500;}
  .i-why{font-size:12.5px;color:var(--muted);margin-top:1px;}
  .i-why.due{color:var(--due);font-weight:500;}
  .i-right{text-align:right;white-space:nowrap;padding-top:1px;}
  .i-qty{font-size:13px;color:var(--ink-soft);}
  .i-price{font-size:12px;color:var(--muted);}
  .empty{padding:16px 2px;color:var(--muted);font-size:14px;font-style:italic;}
  .weekrow{display:flex;align-items:baseline;gap:12px;padding:12px 2px;border-bottom:1px solid var(--rule-soft);}
  .weekrow.today .w-day{color:var(--terra);}
  .weekrow.today .w-meal{font-weight:600;}
  .w-day{font-family:'Fraunces',serif;font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:var(--green);width:72px;flex:0 0 72px;}
  .w-meal{font-size:15px;flex:1;}
  .w-fun{font-size:11px;color:var(--terra);background:rgba(196,112,63,.12);border-radius:999px;padding:3px 8px;}
  .foot{color:var(--muted);font-size:12.5px;margin-top:26px;line-height:1.6;}
  .foot b{color:var(--ink-soft);}
  .hidden{display:none;}
</style>
</head>

"Spaghetti + meatballs":{serves:6,ing:[{a:1,u:"lb",n:"spaghetti",g:"spag"},{a:24,u:"",n:"frozen meatballs",g:"mball"},{a:1,u:"jar",n:"pasta sauce",g:"marin"},{a:1,u:"loaf",n:"garlic bread",g:"gbread"},{a:0.5,u:"cup",n:"parmesan",g:"parm"},{a:6,u:"cup",n:"salad greens",g:"salad"},{a:2,u:"tsp",n:"Italian seasoning",g:"italsn"},{a:0.5,u:"tsp",n:"red pepper flakes",g:"pepflake"},{a:1,u:"tsp",n:"salt",g:"salt"}],steps:["Move the meatballs to the fridge the night before, or cook from frozen with 10 extra min.","Simmer the meatballs in the pasta sauce, covered, 20 min.","Boil the spaghetti in well salted water.","Bake the garlic bread per the package.","Serve the meatballs and sauce over the pasta with parmesan and a salad."]},
"Baked penne":{serves:6,ing:[{a:1,u:"lb",n:"penne",g:"pasta"},{a:2,u:"lb",n:"ground beef",g:"beef"},{a:1,u:"jar",n:"pasta sauce",g:"marin"},{a:1,u:"tub",n:"ricotta (15 oz)",g:"ric"},{a:2,u:"cup",n:"mozzarella",g:"mozz"},{a:3,u:"cup",n:"spinach",g:"spin"},{a:0.5,u:"cup",n:"parmesan",g:"parm"},{a:2,u:"tsp",n:"Italian seasoning",g:"italsn"},{a:1,u:"tsp",n:"garlic powder",g:"garpow"},{a:0.5,u:"tsp",n:"red pepper flakes",g:"pepflake"},{a:1,u:"tsp",n:"salt",g:"salt"}],steps:["Boil the penne 2 min shy of al dente. It finishes cooking in the oven.","Brown the ground beef, drain, and add the pasta sauce, Italian seasoning, garlic powder, red pepper flakes, and salt. Stir in the spinach until it wilts.","Mix the pasta into the sauce.","Spread half in a 9x13, dollop the ricotta across it, then add the rest of the pasta.","Top with mozzarella and parmesan. Bake at 375 F for 25 min until bubbling and browned."]},
"Chicken alfredo":{serves:6,ing:[{a:1,u:"lb",n:"pasta",g:"pasta"},{a:2,u:"lb",n:"diced chicken breast",g:"diced"},{a:1,u:"jar",n:"alfredo sauce",g:"alf"},{a:0.5,u:"cup",n:"parmesan",g:"parm"},{a:4,u:"cup",n:"broccoli florets",g:"broc"},{a:0.5,u:"cup",n:"milk",g:"milk"},{a:1,u:"tsp",n:"garlic powder",g:"garpow"},{a:1,u:"tsp",n:"Italian seasoning",g:"italsn"},{a:0.5,u:"tsp",n:"black pepper",g:"pepper"},{a:1,u:"tsp",n:"salt",g:"salt"}],steps:["Boil the pasta in salted water. Save 1 cup of the pasta water before draining.","Thaw and cook the chicken in a skillet over medium high until browned through, 8 min.","Steam the broccoli.","Add the alfredo sauce, milk, garlic powder, Italian seasoning, salt, and pepper. Warm through, do not boil it.","Toss with the pasta and broccoli. Loosen with pasta water if it is tight. Finish with parmesan."]},
"Homemade pizza":{serves:6,ing:[{a:4,u:"cup",n:"bread flour",g:"bflour"},{a:1,u:"cup",n:"sourdough starter",g:"bflour"},{a:1,u:"jar",n:"pizza sauce",g:"pizsc"},{a:3,u:"cup",n:"mozzarella",g:"mozz"},{a:1,u:"bag",n:"pepperoni",g:"pep"},{a:1,u:"cup",n:"sliced mushrooms",g:"mush"},{a:1,u:"",n:"green bell pepper, sliced",g:"gbell"},{a:1,u:"can",n:"sliced black olives",g:"olive"},{a:2,u:"tsp",n:"salt",g:"salt"},{a:1,u:"tsp",n:"Italian seasoning",g:"italsn"},{a:0.5,u:"tsp",n:"garlic powder",g:"garpow"}],steps:["The night before: feed the sourdough starter.","In the morning: mix the flour, starter, 1.5 cups water, and the salt. Knead briefly and let it rise all day.","Preheat the oven as hot as it goes, 500 F, with the pan or stone inside for 30 min.","Divide the dough in two. Stretch each out on parchment.","Top with sauce, mozzarella, pepperoni, mushrooms, pepper, and olives. Dust the crust with Italian seasoning and garlic powder.","Bake 10 to 12 min until the crust is browned and the cheese is bubbling."]},
"Smoked lasagna":{serves:6,ing:[{a:1,u:"",n:"frozen lasagna (90 oz)",g:"lasg"},{a:1,u:"loaf",n:"garlic bread",g:"gbread"},{a:6,u:"cup",n:"salad greens",g:"salad"}],steps:["The night before: move the frozen lasagna to the fridge.","Early afternoon: Joshua starts the smoker, target 225 to 250 F.","Smoke the lasagna about 3 hours, until the center reads 165 F.","Rest 15 min before cutting or it will not hold its shape.","Bake the garlic bread. Serve with a big salad."]},
"Chicken stir fry":{serves:6,ing:[{a:2,u:"lb",n:"diced chicken breast",g:"diced"},{a:4,u:"cup",n:"broccoli florets",g:"broc"},{a:2,u:"",n:"bell peppers, sliced",g:"bell"},{a:0.33,u:"cup",n:"soy sauce",g:"soy"},{a:2,u:"tbsp",n:"sesame oil",g:"sesame"},{a:1,u:"tbsp",n:"minced garlic",g:"garlic"},{a:2,u:"cup",n:"rice",g:"rice"},{a:1,u:"tsp",n:"ground ginger",g:"ginger"},{a:0.5,u:"tsp",n:"red pepper flakes",g:"pepflake"},{a:0.5,u:"tsp",n:"black pepper",g:"pepper"}],steps:["Thaw the chicken. Start the rice.","Heat the sesame oil in a large skillet or wok until it shimmers.","Sear the chicken 6 to 8 min without crowding the pan, until browned through.","Add the broccoli and peppers. Stir fry 4 to 5 min. They should stay crisp.","Add the garlic, ginger, red pepper flakes, and soy sauce. Toss for 1 min. Serve over rice."]},
"Teriyaki chicken + rice":{serves:6,ing:[{a:2,u:"lb",n:"diced chicken breast",g:"diced"},{a:0.75,u:"cup",n:"teriyaki sauce",g:"ter"},{a:2,u:"cup",n:"rice",g:"rice"},{a:2,u:"cup",n:"sweet peas",g:"peas"},{a:3,u:"cup",n:"broccoli florets",g:"broc"},{a:1,u:"tsp",n:"ground ginger",g:"ginger"},{a:1,u:"tsp",n:"garlic powder",g:"garpow"}],steps:["Thaw the chicken. Optionally marinate it in half the teriyaki overnight.","Start the rice.","Cook the chicken in a hot skillet until browned and cooked through, 8 min.","Add the remaining teriyaki with the ginger and garlic powder. Let it bubble and glaze the chicken, 3 to 4 min.","Steam the peas and broccoli. Serve over rice."]},
"Chicken chow mein":{serves:6,ing:[{a:2,u:"lb",n:"diced chicken breast",g:"diced"},{a:1,u:"bag",n:"coleslaw mix",g:"slaw"},{a:2,u:"cup",n:"carrots, shredded",g:"carrot"},{a:0.33,u:"cup",n:"soy sauce",g:"soy"},{a:2,u:"tbsp",n:"sesame oil",g:"sesame"},{a:1,u:"tbsp",n:"minced garlic",g:"garlic"},{a:1,u:"can",n:"chow mein noodles",g:"chow"},{a:1,u:"tsp",n:"ground ginger",g:"ginger"},{a:0.5,u:"tsp",n:"black pepper",g:"pepper"}],steps:["Thaw the chicken.","Heat the sesame oil and cook the chicken until browned through, 8 min.","Add the coleslaw mix, carrots, ginger, and pepper. Stir fry 5 min until wilted but still bright.","Add the garlic, ginger, and soy sauce. Toss 1 min.","Serve topped with the crunchy chow mein noodles."]},
"Potstickers + chicken fried rice":{serves:6,ing:[{a:1,u:"bag",n:"chicken potstickers",g:"pstick"},{a:1,u:"lb",n:"diced chicken breast",g:"diced"},{a:4,u:"cup",n:"day-old cooked rice",g:"rice"},{a:3,u:"",n:"eggs",g:"eggs"},{a:1,u:"cup",n:"sweet peas",g:"peas"},{a:1,u:"cup",n:"carrots, diced",g:"carrot"},{a:0.33,u:"cup",n:"soy sauce",g:"soy"},{a:2,u:"tbsp",n:"sesame oil",g:"sesame"},{a:1,u:"tsp",n:"ground ginger",g:"ginger"},{a:0.5,u:"tsp",n:"black pepper",g:"pepper"},{a:0.5,u:"tsp",n:"salt",g:"salt"}],steps:["The night before: cook the rice and refrigerate it. Cold day-old rice fries best.","Thaw the chicken. Scramble the eggs in a skillet, then set them aside.","Heat the sesame oil. Cook the chicken through, then add the peas and carrots, 3 min.","Add the cold rice. Press it flat and let it sit a minute so it crisps before stirring.","Return the eggs, add the soy sauce, ginger, salt, and pepper, and toss everything together.","Cook the potstickers per the package and serve alongside."]},
"Shrimp + chicken stir fry":{serves:6,ing:[{a:12,u:"oz",n:"frozen shrimp",g:"shrimp"},{a:1,u:"lb",n:"diced chicken breast",g:"diced"},{a:4,u:"cup",n:"broccoli florets",g:"broc"},{a:2,u:"cup",n:"sweet peas",g:"peas"},{a:0.33,u:"cup",n:"soy sauce",g:"soy"},{a:2,u:"tbsp",n:"sesame oil",g:"sesame"},{a:1,u:"tbsp",n:"minced garlic",g:"garlic"},{a:2,u:"cup",n:"rice",g:"rice"},{a:1,u:"tsp",n:"ground ginger",g:"ginger"},{a:0.5,u:"tsp",n:"red pepper flakes",g:"pepflake"},{a:1,u:"tsp",n:"salt",g:"salt"}],steps:["Thaw the shrimp and chicken. Pat the shrimp dry. Start the rice.","Cook the chicken first in hot sesame oil, 6 min, then set it aside.","Add the shrimp. They cook fast, 2 to 3 min until just pink. Do not overcook them or they turn rubbery.","Add the broccoli, peas, garlic, ginger, red pepper flakes, and salt. Stir fry 4 min.","Return the chicken, add the soy sauce, toss, and serve over rice."]},
"Grilled burgers":{serves:6,ing:[{a:2,u:"lb",n:"ground beef",g:"beef"},{a:8,u:"",n:"hamburger buns",g:"hbun"},{a:8,u:"slice",n:"cheddar cheese",g:"slices"},{a:3,u:"cup",n:"shredded lettuce",g:"salad"},{a:2,u:"",n:"tomatoes, sliced",g:"tom"},{a:2,u:"tsp",n:"Kinder's seasoning",g:"kinder"},{a:1,u:"tsp",n:"garlic powder",g:"garpow"}],steps:["Form the beef into 6 to 8 patties. Press a dimple into the center of each so they do not dome up.","Season both sides generously with the Kinder's blend and garlic powder right before grilling.","Grill over medium high, 4 to 5 min per side. Flip once, do not press them.","Add the cheese in the last minute and close the lid to melt it.","Toast the buns on the grill. Serve with lettuce and tomato."]},
"Grilled burgers + corn":{serves:6,ing:[{a:2,u:"lb",n:"ground beef",g:"beef"},{a:8,u:"",n:"hamburger buns",g:"hbun"},{a:8,u:"slice",n:"cheddar cheese",g:"slices"},{a:6,u:"",n:"corn on the cob",g:"corn"},{a:3,u:"cup",n:"shredded lettuce",g:"salad"},{a:2,u:"",n:"tomatoes, sliced",g:"tom"},{a:2,u:"tsp",n:"Kinder's seasoning",g:"kinder"},{a:1,u:"tsp",n:"garlic powder",g:"garpow"}],steps:["Form the beef into 6 to 8 patties, dimple the centers, and season with the Kinder's blend and garlic powder.","Grill the corn, still in the husk or wrapped in foil with butter, about 15 min, turning.","Grill the patties over medium high, 4 to 5 min per side.","Add the cheese the last minute, lid closed.","Toast the buns. Serve with lettuce and tomato."]},
"Grilled hot dogs / brats":{serves:6,ing:[{a:8,u:"",n:"hot dogs",g:"dogs"},{a:6,u:"",n:"brats",g:"brats"},{a:8,u:"",n:"hot dog buns",g:"dbun"},{a:6,u:"",n:"corn on the cob",g:"corn"}],steps:["Grill the brats over medium, turning, 12 to 15 min until browned and cooked through.","Add the hot dogs, they only need 6 to 8 min.","Grill the corn alongside, about 15 min.","Toast the buns on the grill the last minute.","Serve with your usual toppings."]},
"Grilled brats + veg":{serves:6,ing:[{a:6,u:"",n:"brats",g:"brats"},{a:1,u:"",n:"kielbasa, sliced",g:"kielbasa"},{a:8,u:"",n:"hot dog buns",g:"dbun"},{a:2,u:"",n:"bell peppers, sliced",g:"bell"},{a:1,u:"",n:"yellow onion, sliced",g:"onion"},{a:1,u:"tsp",n:"Kinder's seasoning",g:"kinder"}],steps:["Grill the brats over medium heat, turning, 12 to 15 min until cooked through.","Add the sliced kielbasa, it just needs to warm and char, 5 min.","Grill the peppers and onion in a foil packet with oil and salt, about 10 min.","Toast the buns. Serve the brats with the peppers and onions on top."]},
"Grilled BBQ chicken + corn":{serves:6,ing:[{a:3,u:"lb",n:"chicken thighs",g:"thighs"},{a:1,u:"cup",n:"BBQ sauce",g:"bbq"},{a:6,u:"",n:"corn on the cob",g:"corn"},{a:6,u:"cup",n:"salad greens",g:"salad"},{a:2,u:"tsp",n:"smoked paprika",g:"paprika"},{a:1,u:"tsp",n:"garlic powder",g:"garpow"},{a:1,u:"tsp",n:"onion powder",g:"onionpow"},{a:1.5,u:"tsp",n:"salt",g:"salt"},{a:1,u:"tsp",n:"black pepper",g:"pepper"}],steps:["Thaw the chicken. Rub it all over with the paprika, garlic powder, onion powder, salt, and pepper.","Grill over medium, 6 to 7 min per side, until it reads 175 F for thighs.","Brush on the BBQ sauce only in the last 3 to 4 min. The sugar burns if you add it early.","Grill the corn alongside, about 15 min, turning.","Serve with a salad."]},
"Grilled BBQ chicken":{serves:6,ing:[{a:3,u:"lb",n:"chicken thighs",g:"thighs"},{a:1,u:"cup",n:"BBQ sauce",g:"bbq"},{a:6,u:"cup",n:"salad greens",g:"salad"},{a:2,u:"lb",n:"potatoes",g:"pot"},{a:2,u:"tsp",n:"smoked paprika",g:"paprika"},{a:1,u:"tsp",n:"garlic powder",g:"garpow"},{a:1,u:"tsp",n:"onion powder",g:"onionpow"},{a:1.5,u:"tsp",n:"salt",g:"salt"},{a:1,u:"tsp",n:"black pepper",g:"pepper"}],steps:["Thaw the chicken. Rub it all over with the paprika, garlic powder, onion powder, salt, and pepper.","Cut the potatoes into wedges, toss with oil and salt, roast at 425 F for 30 min.","Grill the chicken over medium, 6 to 7 min per side, to 175 F.","Brush on the BBQ sauce in the last 3 to 4 min only.","Serve with the potatoes and a salad."]},
"Grilled chicken + potatoes":{serves:6,ing:[{a:3,u:"lb",n:"chicken thighs",g:"thighs"},{a:2,u:"tbsp",n:"Kinder's seasoning",g:"kinder"},{a:3,u:"lb",n:"potatoes",g:"pot"},{a:6,u:"cup",n:"salad greens",g:"salad"},{a:2,u:"tbsp",n:"olive oil",g:"oil"},{a:1,u:"tsp",n:"smoked paprika",g:"paprika"},{a:1,u:"tsp",n:"garlic powder",g:"garpow"}],steps:["Thaw the chicken and season it all over with the Kinder's blend, paprika, and garlic powder.","Cut the potatoes into wedges. Toss with olive oil and salt. Roast at 425 F for 30 to 35 min, flipping once.","Grill the chicken over medium, 6 to 7 min per side, to 175 F.","Rest the chicken 5 min. Serve with the potatoes and a salad."]},
"Grilled pork chops + salad":{serves:6,ing:[{a:6,u:"",n:"pork loin chops",g:"chops"},{a:2,u:"tbsp",n:"Kinder's seasoning",g:"kinder"},{a:8,u:"cup",n:"salad greens",g:"salad"},{a:1,u:"cup",n:"ranch dressing",g:"ranch"},{a:2,u:"",n:"tomatoes",g:"tom"},{a:2,u:"",n:"cucumbers",g:"cuke"},{a:1,u:"tsp",n:"garlic powder",g:"garpow"},{a:0.5,u:"tsp",n:"black pepper",g:"pepper"}],steps:["Season the chops with the garlic powder, pepper, and salt in the morning if you can. It makes a real difference.","Bring them to room temp 20 min before grilling.","Grill over medium high, 4 to 5 min per side, until 145 F in the center.","Rest them 5 min before serving. This is what keeps them juicy.","Serve with a big salad, tomatoes, cucumbers, and ranch."]},
"Baked pork chops + potatoes":{serves:6,ing:[{a:6,u:"",n:"pork loin chops",g:"chops"},{a:3,u:"lb",n:"potatoes",g:"pot"},{a:3,u:"cup",n:"green beans",g:"gbean"},{a:2,u:"tbsp",n:"olive oil",g:"oil"},{a:1,u:"tbsp",n:"Kinder's seasoning",g:"kinder"},{a:1,u:"tsp",n:"smoked paprika",g:"paprika"},{a:1,u:"tsp",n:"garlic powder",g:"garpow"},{a:1,u:"tsp",n:"salt",g:"salt"},{a:0.5,u:"tsp",n:"black pepper",g:"pepper"}],steps:["Cut the potatoes into wedges. Toss with olive oil and salt.","Spread on a sheet pan and roast at 425 F for 15 min.","Season the chops with the paprika, garlic powder, salt, and pepper. Add them to the pan and roast 20 more min, until they hit 145 F.","Steam the green beans while it finishes.","Rest the chops 5 min before serving."]},
"Sausage + peppers":{serves:6,ing:[{a:1,u:"lb",n:"Italian sausage",g:"isaus"},{a:1,u:"",n:"kielbasa, sliced",g:"kielbasa"},{a:3,u:"",n:"bell peppers, sliced",g:"bell"},{a:1,u:"",n:"yellow onion, sliced",g:"onion"},{a:1,u:"tbsp",n:"minced garlic",g:"garlic"},{a:2,u:"cup",n:"rice",g:"rice"},{a:1,u:"tsp",n:"Italian seasoning",g:"italsn"},{a:0.5,u:"tsp",n:"red pepper flakes",g:"pepflake"},{a:1,u:"tsp",n:"salt",g:"salt"}],steps:["Start the rice.","Brown the Italian sausage in a large skillet, breaking it up. Add the sliced kielbasa. Set both aside.","In the same pan, cook the peppers and onion 8 min with the Italian seasoning, red pepper flakes, and salt, until softened and browning at the edges.","Add the garlic, cook 1 min.","Return the sausage, toss it all together, and serve over rice."]},
"Sloppy joes":{serves:6,ing:[{a:2,u:"lb",n:"ground beef",g:"beef"},{a:1,u:"packet",n:"sloppy joe mix",g:"sjmix"},{a:1,u:"can",n:"tomato sauce",g:"tsauce"},{a:8,u:"",n:"hamburger buns",g:"hbun"},{a:6,u:"cup",n:"salad greens",g:"salad"},{a:1,u:"tsp",n:"garlic powder",g:"garpow"},{a:1,u:"tsp",n:"onion powder",g:"onionpow"},{a:0.5,u:"tsp",n:"black pepper",g:"pepper"}],steps:["Brown the ground beef in a skillet, drain the fat.","Add the sloppy joe mix, the tomato sauce, and 1/2 cup water.","Simmer 10 min until it thickens.","Toast the buns.","Spoon it over the buns. Serve with a salad."]},
"Breakfast for dinner":{serves:6,ing:[{a:12,u:"",n:"eggs",g:"eggs"},{a:1,u:"lb",n:"bacon",g:"bacon"},{a:1,u:"can",n:"biscuits",g:"bisc"},{a:4,u:"cup",n:"hash browns",g:"hash"},{a:0.5,u:"cup",n:"syrup",g:"syrup"},{a:2,u:"cup",n:"strawberries",g:"straw"},{a:1,u:"tsp",n:"salt",g:"salt"},{a:0.5,u:"tsp",n:"black pepper",g:"pepper"},{a:0.5,u:"tsp",n:"cinnamon",g:"cinnamon"}],steps:["Bake the biscuits per the package, 12 to 15 min at 375 F.","Cook the bacon on a sheet pan in the oven, 400 F for 15 min, so it stays flat and you are not babysitting a pan.","Crisp the hash browns in a skillet, 8 min, without stirring too much.","Scramble the eggs low and slow with butter, salt, and pepper, pulling them off while still slightly wet.","Serve with fruit and syrup."]},
"Slow cooker pot roast":{serves:6,ing:[{a:3,u:"lb",n:"chuck roast",g:"roast"},{a:2,u:"cup",n:"beef broth",g:"bbroth"},{a:2,u:"lb",n:"potatoes, chunked",g:"pot"},{a:3,u:"cup",n:"carrots",g:"carrot"},{a:1,u:"",n:"yellow onion, quartered",g:"onion"},{a:1,u:"tbsp",n:"minced garlic",g:"garlic"},{a:2,u:"tsp",n:"salt",g:"salt"},{a:1,u:"tsp",n:"black pepper",g:"pepper"},{a:1,u:"tsp",n:"onion powder",g:"onionpow"},{a:1,u:"tsp",n:"thyme",g:"thyme"},{a:2,u:"",n:"bay leaves",g:"bay"}],steps:["Thaw the roast overnight if frozen. Pat it dry and season it all over with the salt, pepper, onion powder, and thyme.","Sear it hard on all sides in a hot skillet, 3 min a side. Do not skip this, it is where the flavor comes from.","Put the roast in the crockpot with the potatoes, carrots, onion, garlic, and beef broth.","Cook on low for 8 hours. Do not lift the lid, it adds 20 min every time.","Shred the meat and serve with the vegetables and broth spooned over."]},
"Beef stew":{serves:6,ing:[{a:3,u:"lb",n:"chuck roast, cubed",g:"roast"},{a:3,u:"cup",n:"beef broth",g:"bbroth"},{a:3,u:"cup",n:"carrots",g:"carrot"},{a:2,u:"lb",n:"potatoes, chunked",g:"pot"},{a:3,u:"stalk",n:"celery",g:"celery"},{a:1,u:"",n:"yellow onion, diced",g:"onion"},{a:3,u:"tbsp",n:"flour",g:"flour"},{a:2,u:"tsp",n:"salt",g:"salt"},{a:1,u:"tsp",n:"black pepper",g:"pepper"},{a:1,u:"tsp",n:"thyme",g:"thyme"},{a:2,u:"",n:"bay leaves",g:"bay"},{a:1,u:"tsp",n:"smoked paprika",g:"paprika"}],steps:["Cut the roast into 1 inch cubes. Pat them dry and season with the salt, pepper, paprika, and thyme.","Toss the cubes in the flour. Brown them in batches in a hot pot, do not crowd the pan.","Add the onion and celery, cook 4 min.","Add the broth, carrots, and potatoes. Scrape the browned bits off the bottom.","Crockpot on low 8 hours, or simmer covered on the stove 2 to 3 hours until fork tender."]},
"Chili + cornbread":{serves:6,ing:[{a:2,u:"lb",n:"ground beef",g:"beef"},{a:1,u:"",n:"yellow onion, diced",g:"onion"},{a:2,u:"can",n:"chili beans",g:"chili"},{a:2,u:"can",n:"kidney beans",g:"kid"},{a:2,u:"can",n:"diced tomatoes",g:"rotel"},{a:2,u:"can",n:"tomato sauce",g:"tsauce"},{a:2,u:"box",n:"Jiffy corn muffin mix",g:"cbread"},{a:1,u:"cup",n:"sharp cheddar",g:"ched"},{a:0.5,u:"cup",n:"sour cream",g:"sour"},{a:3,u:"tbsp",n:"chili powder",g:"chilipow"},{a:1,u:"tbsp",n:"cumin",g:"cumin"},{a:1,u:"tsp",n:"smoked paprika",g:"paprika"},{a:1,u:"tsp",n:"oregano",g:"oregano"},{a:0.5,u:"tsp",n:"red pepper flakes",g:"pepflake"},{a:2,u:"tsp",n:"salt",g:"salt"}],steps:["Brown the ground beef with the diced onion, drain the fat.","Add the chili beans, kidney beans, diced tomatoes, and tomato sauce.","Add all the spices. Simmer at least 40 min, and longer is genuinely better here, the flavor deepens.","Make the cornbread per the box while it simmers.","Serve topped with cheddar and sour cream."]},
"Chicken tortilla soup":{serves:6,ing:[{a:2,u:"lb",n:"diced chicken breast",g:"diced"},{a:4,u:"cup",n:"chicken broth",g:"cbroth"},{a:2,u:"can",n:"Rotel",g:"rotel"},{a:2,u:"can",n:"black beans, drained",g:"black"},{a:2,u:"cup",n:"frozen corn",g:"fcorn"},{a:1,u:"bag",n:"tortilla chips",g:"chips"},{a:2,u:"cup",n:"fiesta cheese",g:"fiesta"},{a:2,u:"",n:"avocados",g:"avo"},{a:2,u:"tbsp",n:"lime juice",g:"lime"},{a:0.25,u:"cup",n:"cilantro",g:"cil"},{a:1,u:"tbsp",n:"cumin",g:"cumin"},{a:1,u:"tbsp",n:"chili powder",g:"chilipow"},{a:1,u:"tsp",n:"smoked paprika",g:"paprika"},{a:1,u:"tsp",n:"oregano",g:"oregano"},{a:2,u:"tsp",n:"salt",g:"salt"}],steps:["Thaw the chicken. Cook it through in the pot, then shred it.","Add the chicken broth, Rotel, black beans, and corn.","Simmer 25 min so the flavors come together.","Add the cumin, chili powder, paprika, oregano, and salt early so they bloom. Finish with lime juice and cilantro.","Serve topped with crushed chips, cheese, and avocado."]},
"Chicken noodle soup":{serves:6,ing:[{a:2,u:"lb",n:"diced chicken breast",g:"diced"},{a:6,u:"cup",n:"chicken broth",g:"cbroth"},{a:12,u:"oz",n:"egg noodles",g:"enood"},{a:3,u:"cup",n:"carrots, sliced",g:"carrot"},{a:3,u:"stalk",n:"celery, sliced",g:"celery"},{a:1,u:"",n:"yellow onion, diced",g:"onion"},{a:2,u:"tbsp",n:"butter",g:"butter"},{a:2,u:"tsp",n:"salt",g:"salt"},{a:1,u:"tsp",n:"black pepper",g:"pepper"},{a:1,u:"tsp",n:"thyme",g:"thyme"},{a:2,u:"",n:"bay leaves",g:"bay"},{a:1,u:"tsp",n:"garlic powder",g:"garpow"}],steps:["Thaw and dice the chicken.","Melt the butter in a large pot. Cook the onion, carrots, and celery 6 min until softened.","Add the chicken broth and the chicken. Simmer 20 min.","Add the egg noodles and cook 8 more min until tender.","Season well with salt and pepper. Soup needs more salt than you expect."]},

// ---------- recipe scaling ----------
function fmtAmt(n){
 if(n>=10) return String(Math.round(n));
 var whole=Math.floor(n), frac=n-whole;
 var f="";
 if(frac>0.80){whole+=1;frac=0;}
 else if(frac>0.70) f="3/4";
 else if(frac>0.58) f="2/3";
 else if(frac>0.42) f="1/2";
 else if(frac>0.29) f="1/3";
 else if(frac>0.17) f="1/4";
 else if(frac>0.08) f="1/8";
 if(whole===0 && !f) return n.toFixed(1);
 if(!f) return String(whole);
 return whole? whole+" "+f : f;
}
function scaleLine(x,factor){
 var a=x.a*factor;
 var amt=fmtAmt(a);
 var u=x.u?(" "+x.u):"";
 return amt+u+"  "+x.n;
}

var BACKUP_KEYS=["mealBought","mealBatch","mealHistory","mealRatings","mealSwaps","mealBudget"];
function makeBackup(){
 var o={v:1,app:"kitchen",saved:iso(strip(new Date())),data:{}};
 BACKUP_KEYS.forEach(function(k){var v=LS(k,null);if(v!==null)o.data[k]=v;});
 return JSON.stringify(o);
}
function restoreBackup(txt){
 var o;
 try{ o=JSON.parse(txt.trim()); }catch(e){ return "That does not look like a backup. Paste the whole thing, including the curly braces."; }
 if(!o||o.app!=="kitchen"||!o.data) return "That backup is not from the Kitchen app.";
 var n=0;
 Object.keys(o.data).forEach(function(k){
  if(BACKUP_KEYS.indexOf(k)>=0){ SS(k,o.data[k]); n++; }
 });
 return n? null : "Nothing to restore in that backup.";
}

 var recent=history.slice(-8);
 var sum=recent.reduce(function(a,o){return a+o.t*(7/o.days);},0);
 return sum/recent.length;
}

// ---------- meal swap ----------
// A meal is "available" if every trigger ingredient it needs was bought recently enough
// to still be on hand. Frozen and pantry keep longer than fresh.
var SHELF={Frozen:35,Pantry:60,Backstock:60,Dairy:14,Produce:8,Protein:10,Bread:10};
var swaps=(function(){try{return JSON.parse(LS("mealSwaps","{}"))||{};}catch(e){return {};}})();

function triggersFor(meal){
 return G.filter(function(g){return g.trig && g.trig.indexOf(meal)>=0;});
}
function onHand(g,d){
 var last=bought[g.id];
 if(!last)return false;
 var age=dbet(fromIso(last),d);
 var shelf=SHELF[g.s]||21;
 return age<=shelf;
}
function mealAvailable(meal,d){
 var t=triggersFor(meal);
 for(var i=0;i<t.length;i++){ if(!onHand(t[i],d))return false; }
 return true;
}
function allMeals(){
 var s=[];
 [SUMMER,FALL,WINTER,SPRING].forEach(function(P){
  P.forEach(function(w){w.forEach(function(m){if(s.indexOf(m)<0)s.push(m);});});
 });
 return s;
}
function minutesOf(meal){
 var h=(D[meal]||{}).hd||"";
 var m=/(\d+)/.exec(h);
 return m?parseInt(m[1],10):30;
}
function swapCandidates(d,current){
 var season=seasonOf(d);
 var out=allMeals().filter(function(m){
  if(m===current)return false;
  if(!mealAvailable(m,d))return false;
  // no lasagna unless it's a Saturday, it needs the smoker and Joshua
  if(m==="Smoked lasagna" && d.getDay()!==6)return false;
  // crockpot meals need a morning start, not a same-day rescue
  if(/pot roast|Beef stew/i.test(m))return false;
  // pizza needs dough started in the morning
  if(m==="Homemade pizza")return false;
  return true;
 });
 out.sort(function(a,b){return minutesOf(a)-minutesOf(b);});
 return out;
}

function dueInfo(it,sd){
 if(it.cad===0)return null;
 var last=bought[it.id];
 if(!last)return {due:true,txt:"not logged yet"};
 var d=dbet(fromIso(last),sd);
 if(d>=it.cad)return {due:true,txt:d+" days since last"};
 return {due:false,txt:""};
}
function recipeNeeds(uniq){var s={};uniq.forEach(function(m){var r=RECIPE[m];if(!r||!r.ing)return;r.ing.forEach(function(i){s[i.g]=1;});});return s;}

 for(var i=0;i<days;i++){var d=new Date(sd);d.setDate(d.getDate()+i);var m=mealFor(d);meals.push(m);if(uniq.indexOf(m)<0)uniq.push(m);}
 var season=seasonOf(sd);
 var out=[];
 G.forEach(function(it){
  if(it.sn&&it.sn!==season)return;
  if(it.trig){
   var hits=it.trig.filter(function(m){return uniq.indexOf(m)>=0;});
   if(!hits.length)return;
   if(it.cad>0){var di=dueInfo(it,sd);if(!di||!di.due)return;}
   out.push({it:it,why:"for "+hits[0],q:it.q});return;
  }
  var di=dueInfo(it,sd);
  if(di&&di.due)out.push({it:it,why:di.txt,q:it.q});
 });

 if(pepd>=3)out.push({it:{id:"bell2",wid:"47770124",n:"Bell peppers, 2nd 3-pack",q:1,p:2.97,s:"Produce"},why:"pepper-heavy stretch ("+pepd+" meals)",q:1,need:true});

 out.forEach(function(x){ if(x.need===undefined) x.need=!!(need[x.it.id]||x.it.trig); });

  done.addEventListener("click",function(){

   live.forEach(function(x){if(G.some(function(g){return g.id===x.it.id;}))bought[x.it.id]=t;});
   // held items keep their old date, so they stay due and return next order
   SS("mealBought",JSON.stringify(bought));
   logOrder(total,days);
   if(r.batchDue&&live.some(function(x){return x.it.s==="Batch day";})){lastBatch=t;SS("mealBatch",t);}
   checked={};deferred={};unsel={};render();window.scrollTo({top:0,behavior:"smooth"});
  });
  out.appendChild(done);
 }
 go.addEventListener("click",function(){deferred={};unsel={};render();});
 render();
}
function viewWeek(){
 var el=document.getElementById("v-week");el.innerHTML="";
 var c=document.createElement("div");c.className="card";
 c.innerHTML='<div class="label">Next 14 dinners</div>';
 for(var i=0;i<14;i++){
  var d=new Date(today);d.setDate(d.getDate()+i);
  var row=document.createElement("div");row.className="weekrow"+(i===0?" today":"");
  var dm=mealFor(d);
  var sm=swaps[iso(d)];var rv=ratings[dm];
  row.style.cursor="pointer";
  row.innerHTML='<span class="w-day">'+(i===0?"Today":DAYA[d.getDay()]+" "+d.getDate())+'</span><span class="w-meal">'+dm+(sm?' <span style="font-size:11px;color:var(--terra)">swapped</span>':'')+(rv==="hit"?' <span style="font-size:11px;color:var(--green)">hit</span>':rv==="miss"?' <span style="font-size:11px;color:var(--muted)">miss</span>':'')+'</span>'+(FUN[d.getDay()]?'<span class="w-fun">fun</span>':'')+'<span style="color:var(--terra);font-size:13px;padding-left:8px;">&#9662;</span>';
  var holder=document.createElement("div");
  holder.style.cssText="display:none;padding:0 0 8px;";
  (function(mealName,rowEl,hold){
   var loaded=false;
   rowEl.addEventListener("click",function(){
    if(!loaded){
     var dd=(D[mealName]||{}).db;
     var td=thawDetail(mealName);
     if(dd){
      var pn=document.createElement("div");pn.className="noteline warn";pn.style.margin="8px 0 0";
      pn.innerHTML='<b>Night before</b>'+dd+((td&&/thaw|move|fridge/i.test(dd))?". Pull out: "+td:"");
      hold.appendChild(pn);
     }
     var b=recipeBlock(mealName,"Recipe");
     if(b){ b.open=true; hold.appendChild(b); }
     loaded=true;
    }
    hold.style.display = (hold.style.display==="block") ? "none" : "block";
   });
  })(dm,row,holder);
  c.appendChild(row);
  c.appendChild(holder);
 }
 el.appendChild(c);

 // ---- ratings summary ----
 var rated=Object.keys(ratings);
 var rc=document.createElement("div");rc.className="card";
 rc.innerHTML='<div class="label">What your family thinks</div>';
 if(!rated.length){
  var e=document.createElement("div");e.className="empty";
  e.textContent="No ratings yet. Tap Hit or Miss on the Tonight tab after dinner and they collect here.";
  rc.appendChild(e);
 } else {
  var hits=rated.filter(function(m){return ratings[m]==="hit";}).sort();
  var miss=rated.filter(function(m){return ratings[m]==="miss";}).sort();
  var mk=function(title,list,col){
   if(!list.length)return;
   var hh=document.createElement("div");hh.className="sec";
   hh.innerHTML='<div class="sec-h" style="color:'+col+';border-bottom-color:'+col+'33;"><span>'+title+'</span><span class="cnt">'+list.length+'</span></div>';
   list.forEach(function(m){
    var row=document.createElement("div");row.className="item";
    var body=document.createElement("div");body.className="i-body";
    body.innerHTML='<div class="i-name">'+m+'</div>';
    var x=document.createElement("button");x.className="tbtn";
    x.style.cssText="border-color:var(--rule);color:var(--muted);";
    x.textContent="clear";
    x.addEventListener("click",function(){delete ratings[m];SS("mealRatings",JSON.stringify(ratings));viewWeek();});
    row.appendChild(body);row.appendChild(x);
    hh.appendChild(row);
   });
   rc.appendChild(hh);
  };
  mk("Hits",hits,"var(--green)");
  mk("Misses",miss,"var(--terra)");

  // copyable summary for Claude
  var cb=document.createElement("button");cb.className="btn wide";
  cb.style.cssText="background:transparent;color:var(--green);border:1px solid var(--rule);";
  cb.textContent="Copy ratings to send to Claude";
  cb.addEventListener("click",function(){
   var txt="MEAL RATINGS\n\nHITS:\n"+(hits.length?hits.map(function(m){return "- "+m;}).join("\n"):"- none yet")+
           "\n\nMISSES:\n"+(miss.length?miss.map(function(m){return "- "+m;}).join("\n"):"- none yet");
   var ta=document.createElement("textarea");
   ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";
   document.body.appendChild(ta);ta.select();
   try{document.execCommand("copy");cb.textContent="Copied. Paste it to Claude.";}
   catch(e){cb.textContent="Select and copy manually";}
   setTimeout(function(){document.body.removeChild(ta);},100);
  });
  rc.appendChild(cb);
  var nn=document.createElement("div");nn.className="foot";
  nn.innerHTML="Rate meals as you cook them. When you have enough, send them to Claude and the misses get swapped out of the rotation.";
  rc.appendChild(nn);
 }
 el.appendChild(rc);
 el.appendChild(backupCard());
}
document.getElementById("title").textContent=DAYN[today.getDay()]+", "+MON[today.getMonth()]+" "+today.getDate();
var sn=seasonOf(today);
document.getElementById("sub").textContent="Family of 6. "+sn.charAt(0).toUpperCase()+sn.slice(1)+" plan. $350 a week all in.";
var tabs=[["t-tonight","v-tonight"],["t-shop","v-shop"],["t-week","v-week"]];
tabs.forEach(function(p){document.getElementById(p[0]).addEventListener("click",function(){
 tabs.forEach(function(q){document.getElementById(q[0]).classList.toggle("on",q[0]===p[0]);
  document.getElementById(q[1]).classList.toggle("hidden",q[1]!==p[1]);});});});
viewTonight();viewShop();viewWeek();
document.getElementById("foot").innerHTML="Four seasons, switching on their own. Dinners rotate every 28 days with no repeated protein or cuisine back to back.";
var lk=iso(today);
function roll(){if(iso(strip(new Date()))!==lk)location.reload();}
document.addEventListener("visibilitychange",function(){if(!document.hidden)roll();});
window.addEventListener("focus",roll);setInterval(roll,60000);
})();
</script>
